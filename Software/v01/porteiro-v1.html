<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CondLog v1 - Porteiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .hidden-view {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
      <div class="flex justify-between items-center max-w-md mx-auto">
        <h1 class="text-xl font-bold tracking-wide">CondLog</h1>
        <span class="text-sm bg-blue-700 px-2 py-1 rounded-full">Portaria</span>
      </div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col relative">
      <div id="view-home" class="flex flex-col items-center justify-center flex-1 space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-semibold text-gray-700">Nova Encomenda</h2>
          <p class="text-gray-500">Capture a etiqueta para iniciar o registro.</p>
        </div>

        <button
          onclick="simulateOCR()"
          class="bg-blue-600 hover:bg-blue-700 text-white w-48 h-48 rounded-full flex flex-col items-center justify-center shadow-lg transition transform hover:scale-105 active:scale-95"
        >
          <svg
            class="w-16 h-16 mb-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
          </svg>
          <span class="font-semibold text-lg">Ler Etiqueta</span>
        </button>

        <button onclick="showView('view-form')" class="text-blue-600 font-medium underline mt-4">
          Ou cadastrar manualmente
        </button>
      </div>

      <div id="view-loading" class="hidden-view flex-col items-center justify-center flex-1 space-y-4">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600"></div>
        <p class="text-gray-600 font-medium animate-pulse">Lendo dados com Inteligência Artificial...</p>
      </div>

      <div id="view-form" class="hidden-view flex-col flex-1">
        <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Confirmar Dados</h2>

        <div class="space-y-4 flex-1">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Morador</label>
            <input
              type="text"
              id="input-nome"
              class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none"
              placeholder="Ex: João Silva"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Apartamento</label>
            <input
              type="text"
              id="input-apt"
              class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none"
              placeholder="Ex: 302"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Tamanho da Encomenda</label>
            <div class="grid grid-cols-3 gap-2">
              <button
                class="size-btn border-2 border-gray-200 rounded-lg py-3 text-gray-600 font-medium focus:border-blue-600 focus:bg-blue-50 focus:text-blue-600 transition"
                onclick="selectSize(this)"
              >
                Pequeno
              </button>
              <button
                class="size-btn border-2 border-gray-200 rounded-lg py-3 text-gray-600 font-medium focus:border-blue-600 focus:bg-blue-50 focus:text-blue-600 transition"
                onclick="selectSize(this)"
              >
                Médio
              </button>
              <button
                class="size-btn border-2 border-gray-200 rounded-lg py-3 text-gray-600 font-medium focus:border-blue-600 focus:bg-blue-50 focus:text-blue-600 transition"
                onclick="selectSize(this)"
              >
                Grande
              </button>
            </div>
          </div>
        </div>

        <div class="mt-8 flex gap-3">
          <button
            onclick="showView('view-home')"
            class="flex-1 bg-gray-200 text-gray-700 font-semibold py-3 rounded-lg"
          >
            Cancelar
          </button>
          <button
            onclick="confirmStorage()"
            class="flex-1 bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700"
          >
            Guardar
          </button>
        </div>
      </div>

      <div id="view-success" class="hidden-view flex-col items-center justify-center flex-1 space-y-4">
        <div class="bg-green-100 p-4 rounded-full">
          <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Sucesso!</h2>
        <p class="text-gray-600 text-center">Encomenda registrada.</p>

        <div class="bg-blue-50 border border-blue-200 p-6 rounded-xl w-full text-center mt-4">
          <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Guardar na prateleira</p>
          <p class="text-4xl font-extrabold text-blue-700">P-03</p>
        </div>

        <button
          onclick="resetApp()"
          class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 mt-8"
        >
          Nova Leitura
        </button>
      </div>
    </main>

    <script>
      function showView(viewId) {
        document.querySelectorAll('main > div').forEach((el) => el.classList.add('hidden-view'))
        document.querySelectorAll('main > div').forEach((el) => (el.style.display = 'none'))

        const activeView = document.getElementById(viewId)
        activeView.classList.remove('hidden-view')
        activeView.style.display = 'flex'
      }

      function simulateOCR() {
        showView('view-loading')

        setTimeout(() => {
          document.getElementById('input-nome').value = 'Iury Gonçalves'
          document.getElementById('input-apt').value = '104'
          showView('view-form')
        }, 2000)
      }

      function selectSize(btn) {
        document.querySelectorAll('.size-btn').forEach((b) => {
          b.style.borderColor = '#e5e7eb'
          b.style.backgroundColor = 'transparent'
          b.style.color = '#4b5563'
        })
        btn.style.borderColor = '#2563eb'
        btn.style.backgroundColor = '#eff6ff'
        btn.style.color = '#2563eb'
      }

      function confirmStorage() {
        showView('view-success')
      }

      function resetApp() {
        document.getElementById('input-nome').value = ''
        document.getElementById('input-apt').value = ''
        document.querySelectorAll('.size-btn').forEach((b) => {
          b.style.borderColor = '#e5e7eb'
          b.style.backgroundColor = 'transparent'
          b.style.color = '#4b5563'
        })
        showView('view-home')
      }

      showView('view-home')
    </script>
  </body>
</html>
