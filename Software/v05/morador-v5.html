<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CondLog v5 - Morador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      .hidden-view {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col relative">
    <div id="view-login" class="flex flex-col items-center justify-center flex-1 p-6 space-y-8">
      <div class="text-center">
        <h1 class="text-4xl font-black text-blue-600 tracking-tight mb-2">CondLog</h1>
        <p class="text-slate-500 font-medium tracking-wide uppercase text-sm">Portal do Morador</p>
      </div>

      <div
        class="bg-white p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100 w-full max-w-sm"
      >
        <div class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Usuário</label>
            <input
              type="text"
              id="login-user"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all font-medium"
              placeholder="Ex: iury.goncalves"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Senha</label>
            <input
              type="password"
              id="login-pwd"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all font-medium"
              placeholder="••••••••"
            />
          </div>
          <button
            onclick="fazerLogin()"
            id="btn-login"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl mt-6 shadow-md shadow-blue-200 transition-all active:scale-95"
          >
            Acessar Conta
          </button>
          <p
            id="login-error"
            class="text-red-500 text-sm font-medium text-center hidden mt-4 bg-red-50 p-2 rounded-lg"
          ></p>
        </div>
      </div>
    </div>

    <div id="area-logada" class="hidden-view flex flex-col flex-1">
      <header class="bg-blue-600 p-6 shadow-lg rounded-b-[2rem] text-white">
        <div class="max-w-md mx-auto flex justify-between items-start">
          <div>
            <p class="text-blue-200 text-xs font-bold tracking-wider uppercase mb-1">CondLog Residencial</p>
            <h2 class="text-3xl font-black" id="user-name-display">Olá!</h2>
            <p class="text-blue-100 font-medium mt-1">
              Apt <span id="user-apt-display" class="font-bold">--</span>
            </p>
          </div>
          <button
            onclick="fazerLogout()"
            class="text-sm text-blue-200 hover:text-white font-medium bg-blue-700/50 px-3 py-1.5 rounded-lg transition-colors"
          >
            Sair
          </button>
        </div>
      </header>

      <main class="flex-1 w-full max-w-md mx-auto p-6 flex flex-col mt-4">
        <div id="view-dashboard" class="flex flex-col flex-1 space-y-8">
          <div
            class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between"
          >
            <div>
              <p class="text-slate-500 font-bold text-xs uppercase tracking-wide mb-1">Pacotes Pendentes</p>
              <p class="text-5xl font-black text-slate-800" id="qtd-encomendas">0</p>
            </div>
            <div class="bg-blue-50 p-4 rounded-2xl text-blue-600">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
                ></path>
              </svg>
            </div>
          </div>

          <div class="space-y-4 flex-1">
            <h3 class="font-bold text-slate-800 text-lg">Suas Encomendas</h3>
            <div id="lista-encomendas" class="space-y-3"></div>
          </div>

          <div class="mt-auto pt-6">
            <button
              id="btn-gerar"
              onclick="solicitarQRCode()"
              class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl shadow-slate-300 transition-all active:scale-95 flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"
                ></path>
              </svg>
              Liberar Prateleiras (Gerar QR)
            </button>
          </div>
        </div>

        <div id="view-qr" class="hidden-view flex-col items-center justify-center flex-1 space-y-8">
          <div class="text-center space-y-2">
            <h2 class="text-2xl font-black text-slate-800">Passe no Leitor</h2>
            <p class="text-sm font-medium text-slate-500 bg-slate-200 px-3 py-1 rounded-full inline-block">
              Expira em
              <span id="timer" class="font-bold text-blue-600">05:00</span>
            </p>
          </div>

          <div
            class="bg-white p-6 rounded-[2rem] shadow-2xl shadow-blue-900/10 border-4 border-white ring-1 ring-slate-100 flex justify-center items-center w-full max-w-[280px] mx-auto transform transition-all scale-100 hover:scale-105"
          >
            <div id="qrcode-canvas"></div>
          </div>

          <div class="text-center bg-blue-50 p-4 rounded-2xl border border-blue-100 w-full">
            <p class="text-xs font-bold text-blue-800 uppercase tracking-wide mb-1">Aviso de Segurança</p>
            <p class="text-xs text-blue-600">
              O Totem irá gravar sua retirada e acenderá o LED da sua prateleira.
            </p>
          </div>

          <button
            onclick="voltarInicio()"
            class="text-slate-500 font-bold hover:text-slate-800 transition-colors py-2"
          >
            Cancelar Retirada
          </button>
        </div>
      </main>
    </div>

    <script>
      const API_URL =
        window.location.hostname === '' ? 'http://127.0.0.1:5000' : `http://${window.location.hostname}:5000`
      let apartamentoLogado = null
      let timerInterval

      function showView(viewId) {
        document.getElementById('view-dashboard').classList.add('hidden-view')
        document.getElementById('view-qr').classList.add('hidden-view')
        document.getElementById(viewId).classList.remove('hidden-view')
      }

      async function fazerLogin() {
        const user = document.getElementById('login-user').value
        const pwd = document.getElementById('login-pwd').value
        const btn = document.getElementById('btn-login')
        const err = document.getElementById('login-error')
        btn.innerText = 'Autenticando...'
        err.classList.add('hidden')
        try {
          const res = await fetch(`${API_URL}/api/morador/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario: user, senha: pwd }),
          })
          const data = await res.json()
          if (data.success) {
            apartamentoLogado = data.apartamento
            document.getElementById('user-name-display').innerText = `Olá, ${data.nome.split(' ')[0]}!`
            document.getElementById('user-apt-display').innerText = apartamentoLogado
            document.getElementById('view-login').classList.add('hidden-view')
            document.getElementById('area-logada').classList.remove('hidden-view')
            carregarEncomendas()
          } else {
            err.innerText = data.message
            err.classList.remove('hidden')
          }
        } catch (e) {
          err.innerText = 'Falha de rede.'
          err.classList.remove('hidden')
        }
        btn.innerText = 'Acessar Conta'
      }

      function fazerLogout() {
        apartamentoLogado = null
        document.getElementById('login-pwd').value = ''
        document.getElementById('area-logada').classList.add('hidden-view')
        document.getElementById('view-login').classList.remove('hidden-view')
      }

      async function carregarEncomendas() {
        if (!apartamentoLogado) return
        try {
          const res = await fetch(`${API_URL}/api/morador/${apartamentoLogado}/encomendas`)
          const data = await res.json()
          document.getElementById('qtd-encomendas').innerText = data.encomendas.length
          const listaContainer = document.getElementById('lista-encomendas')
          listaContainer.innerHTML = ''
          if (data.encomendas.length === 0) {
            listaContainer.innerHTML =
              '<div class="text-center py-8"><p class="text-sm font-medium text-slate-400">Nenhuma encomenda na sala de logística.</p></div>'
            document.getElementById('btn-gerar').disabled = true
          } else {
            document.getElementById('btn-gerar').disabled = false
            data.encomendas.forEach((enc) => {
              listaContainer.innerHTML += `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center transition-all hover:shadow-md">
                    <div><p class="font-bold text-slate-800 capitalize mb-1">Pacote ${enc.tamanho}</p><p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Chegou: ${enc.data.split(' ')[0]}</p></div>
                    <div class="bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl text-center"><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Vaga</p><p class="text-sm font-black text-slate-700 leading-none">${enc.prateleira}</p></div>
                </div>`
            })
          }
        } catch (err) {}
      }

      async function solicitarQRCode() {
        const btn = document.getElementById('btn-gerar')
        btn.innerText = 'Gerando Segurança...'
        try {
          const res = await fetch(`${API_URL}/api/morador/${apartamentoLogado}/gerar_qr`, { method: 'POST' })
          const data = await res.json()
          if (data.success) {
            gerarImagemQR(data.token)
            iniciarTimer(300)
            showView('view-qr')
          }
        } catch (err) {
          alert('Erro de Conexão.')
        }
        btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg> Liberar Prateleiras (Gerar QR)`
      }

      function gerarImagemQR(token) {
        document.getElementById('qrcode-canvas').innerHTML = ''
        new QRCode(document.getElementById('qrcode-canvas'), {
          text: token,
          width: 220,
          height: 220,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        })
      }

      function iniciarTimer(segundos) {
        clearInterval(timerInterval)
        let timeLeft = segundos
        timerInterval = setInterval(() => {
          timeLeft--
          const m = Math.floor(timeLeft / 60)
            .toString()
            .padStart(2, '0')
          const s = (timeLeft % 60).toString().padStart(2, '0')
          document.getElementById('timer').innerText = `${m}:${s}`
          if (timeLeft <= 0) voltarInicio()
        }, 1000)
      }

      function voltarInicio() {
        clearInterval(timerInterval)
        carregarEncomendas()
        showView('view-dashboard')
      }
    </script>
  </body>
</html>
