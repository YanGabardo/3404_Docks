<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CondLog - Portaria Integrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .hidden-view {
        display: none !important;
      }
      #video-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        border-radius: 1rem;
        overflow: hidden;
        background-color: #0f172a;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      #camera-preview {
        width: 100%;
        height: auto;
        display: block;
      }
      .guide-ocr {
        border: 3px dashed rgba(255, 255, 255, 0.8);
        height: 40%;
        width: 80%;
      }
      .guide-photo {
        border: 3px solid rgba(59, 130, 246, 0.8);
        height: 80%;
        width: 90%;
      }
      #scanner-guide {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.6);
        pointer-events: none;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-5 shadow-lg sticky top-0 z-10 flex justify-between items-center">
      <div class="flex items-center gap-4 max-w-md mx-auto w-full justify-between">
        <h1 class="text-2xl font-black tracking-tight">CondLog</h1>
        <span
          class="text-[10px] font-bold uppercase tracking-widest bg-blue-800/50 border border-blue-400/30 px-3 py-1.5 rounded-lg shadow-inner"
          >PORTARIA</span
        >
      </div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto p-5 flex flex-col relative">
      <div id="view-home" class="flex flex-col items-center justify-center flex-1 space-y-8">
        <div class="text-center space-y-2">
          <h2 class="text-3xl font-black text-slate-800">Entrada de Pacote</h2>
          <p class="text-sm font-medium text-slate-500">O sistema fará a leitura automática da etiqueta.</p>
        </div>

        <button
          onclick="openCamera('ocr')"
          class="bg-slate-900 hover:bg-black text-white w-56 h-56 rounded-full flex flex-col items-center justify-center shadow-xl shadow-slate-300 transition-all transform hover:scale-105 active:scale-95 group"
        >
          <svg
            class="w-20 h-20 mb-3 text-blue-400 group-hover:text-blue-300 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
          </svg>
          <span class="font-black text-xl tracking-wide">Escanear IA</span>
        </button>

        <button
          onclick="showView('view-form')"
          class="text-slate-400 font-bold hover:text-slate-600 transition-colors text-sm uppercase tracking-wider py-4 block mx-auto"
        >
          Digitar Manualmente
        </button>
      </div>

      <div id="view-camera" class="hidden-view flex-col items-center flex-1 space-y-6">
        <div
          class="w-full flex justify-between items-center mb-2 bg-white p-4 rounded-2xl shadow-sm border border-slate-100"
        >
          <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wide" id="cam-title">
            Alinhe o Texto
          </h2>
          <button
            onclick="stopCameraAndGoHome()"
            class="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg"
          >
            Cancelar
          </button>
        </div>
        <div id="video-container">
          <video id="camera-preview" autoplay playsinline></video>
          <div id="scanner-guide" class="guide-ocr"></div>
        </div>
        <canvas id="capture-canvas" class="hidden"></canvas>
        <button
          onclick="captureImage()"
          class="mt-4 mx-auto block bg-blue-600 hover:bg-blue-700 text-white font-black text-lg py-5 px-8 rounded-2xl shadow-xl transition-all w-full max-w-[300px] active:scale-95"
          id="btn-capture"
        >
          📸 Capturar Etiqueta
        </button>
      </div>

      <div
        id="view-loading"
        class="hidden-view absolute inset-0 bg-slate-50/90 backdrop-blur-sm z-20 flex-col items-center justify-center space-y-6"
      >
        <div class="relative w-24 h-24">
          <div class="absolute inset-0 border-4 border-slate-200 rounded-full"></div>
          <div
            class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"
          ></div>
        </div>
        <p class="text-slate-700 font-black tracking-wide animate-pulse" id="loading-text">
          Processando Nuvem IA...
        </p>
      </div>

      <div id="view-form" class="hidden-view flex-col flex-1">
        <h2 class="text-2xl font-black mb-6 text-slate-800">Confirmar Dados</h2>
        <div class="space-y-5 flex-1 relative bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
          <div class="relative">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2"
              >Morador (Busca Inteligente)</label
            >
            <input
              type="text"
              id="input-nome"
              oninput="handleAutocomplete(this.value)"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 outline-none focus:border-blue-500 transition-all font-bold text-slate-700"
              autocomplete="off"
              placeholder="Digite o nome..."
            />
            <div
              id="autocomplete-box"
              class="absolute left-0 right-0 bg-white border border-slate-200 mt-2 rounded-xl shadow-2xl max-h-48 overflow-y-auto hidden z-20 divide-y divide-slate-50"
            ></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2"
              >Apartamento</label
            >
            <input
              type="text"
              id="input-apt"
              class="w-full bg-slate-100 border border-slate-200 rounded-xl p-4 outline-none font-bold text-slate-500 cursor-not-allowed"
              readonly
              placeholder="Auto"
            />
          </div>
          <div class="pt-2">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-3"
              >Tamanho Físico</label
            >
            <div class="grid grid-cols-3 gap-3">
              <button
                class="size-btn border-2 border-slate-200 rounded-xl py-4 text-slate-500 font-bold transition hover:bg-slate-50"
                onclick="selectSize(this, 'pequeno')"
              >
                P
              </button>
              <button
                class="size-btn border-2 border-slate-200 rounded-xl py-4 text-slate-500 font-bold transition hover:bg-slate-50"
                onclick="selectSize(this, 'médio')"
              >
                M
              </button>
              <button
                class="size-btn border-2 border-slate-200 rounded-xl py-4 text-slate-500 font-bold transition hover:bg-slate-50"
                onclick="selectSize(this, 'grande')"
              >
                G
              </button>
            </div>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button
            onclick="showView('view-home')"
            class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 rounded-2xl transition"
          >
            Cancelar
          </button>
          <button
            onclick="goToPhotoStep()"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition"
          >
            Avançar →
          </button>
        </div>
      </div>

      <div id="view-success" class="hidden-view flex-col items-center justify-center flex-1 space-y-6">
        <div class="bg-green-50 p-6 rounded-full border-4 border-green-100">
          <svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <div class="text-center">
          <h2 class="text-3xl font-black text-slate-800">Registrado!</h2>
          <p class="text-slate-500 font-medium mt-1">E-mail de notificação enviado ao morador.</p>
        </div>
        <button
          onclick="resetApp()"
          class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all mt-8"
        >
          Finalizar e Voltar ao Menu
        </button>
      </div>
    </main>

    <script>
      const video = document.getElementById('camera-preview')
      const canvas = document.getElementById('capture-canvas')
      const API_URL =
        window.location.hostname === '' ? 'http://127.0.0.1:5000' : `http://${window.location.hostname}:5000`
      let stream = null
      let selectedSize = ''
      let cameraMode = 'ocr'
      let photoBase64 = ''

      function showView(viewId) {
        document.querySelectorAll('main > div').forEach((el) => el.classList.add('hidden-view'))
        const view = document.getElementById(viewId)
        view.classList.remove('hidden-view')
        if (viewId === 'view-loading' || viewId === 'view-camera') view.style.display = 'flex'
        else view.style.display = ''
      }

      async function openCamera(mode) {
        cameraMode = mode
        const guide = document.getElementById('scanner-guide')
        const title = document.getElementById('cam-title')
        const btnCapture = document.getElementById('btn-capture')
        if (mode === 'ocr') {
          guide.className = 'guide-ocr'
          title.innerText = 'Alinhe a Etiqueta'
          btnCapture.innerText = '📸 Capturar Etiqueta'
        } else {
          guide.className = 'guide-photo'
          title.innerText = 'Foto da Encomenda'
          btnCapture.innerText = '📦 Salvar e Guardar'
        }
        showView('view-camera')
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false,
          })
          video.srcObject = stream
        } catch (err) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'user' },
              audio: false,
            })
            video.srcObject = stream
          } catch (e) {
            alert('Câmera indisponível.')
            showView('view-home')
          }
        }
      }

      function startCamera() {
        openCamera('ocr')
      }
      function stopCamera() {
        if (stream) stream.getTracks().forEach((track) => track.stop())
      }
      function stopCameraAndGoHome() {
        stopCamera()
        showView('view-home')
      }

      async function captureImage() {
        canvas.width = video.videoWidth
        canvas.height = video.videoHeight
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height)
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6)
        stopCamera()
        if (cameraMode === 'ocr') {
          processOCR(imageDataUrl)
        } else {
          photoBase64 = imageDataUrl
          confirmStorage()
        }
      }

      async function processOCR(imageDataUrl) {
        showView('view-loading')
        try {
          const response = await fetch(`${API_URL}/api/ocr`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageDataUrl }),
          })
          const result = await response.json()
          if (result.matched) {
            document.getElementById('input-nome').value = result.matched.nome
            document.getElementById('input-apt').value = result.matched.apartamento
          } else {
            document.getElementById('input-nome').value = ''
            document.getElementById('input-apt').value = ''
          }
          showView('view-form')
        } catch (error) {
          alert('Falha de IA.')
          showView('view-form')
        }
      }

      function goToPhotoStep() {
        const nome = document.getElementById('input-nome').value
        const apt = document.getElementById('input-apt').value
        if (!nome || !apt || !selectedSize) {
          alert('Preencha os dados do morador e o tamanho antes de avançar.')
          return
        }
        openCamera('photo')
      }

      let debounceTimer
      async function handleAutocomplete(val) {
        const box = document.getElementById('autocomplete-box')
        if (val.trim().length < 2) {
          box.classList.add('hidden')
          return
        }
        clearTimeout(debounceTimer)
        debounceTimer = setTimeout(async () => {
          try {
            const res = await fetch(`${API_URL}/api/moradores/buscar?q=${val}`)
            const data = await res.json()
            if (data.length === 0) {
              box.classList.add('hidden')
              return
            }
            box.innerHTML = ''
            data.forEach((item) => {
              const div = document.createElement('div')
              div.className =
                'p-4 hover:bg-blue-50 cursor-pointer text-sm font-bold text-slate-700 transition flex justify-between items-center'
              div.innerHTML = `<span>${item.nome}</span> <span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded">Apt ${item.apartamento}</span>`
              div.onclick = () => {
                document.getElementById('input-nome').value = item.nome
                document.getElementById('input-apt').value = item.apartamento
                box.classList.add('hidden')
              }
              box.appendChild(div)
            })
            box.classList.remove('hidden')
          } catch (e) {}
        }, 300)
      }

      document.addEventListener('click', function (e) {
        if (!document.getElementById('input-nome').contains(e.target))
          document.getElementById('autocomplete-box').classList.add('hidden')
      })

      function selectSize(btn, size) {
        selectedSize = size
        document.querySelectorAll('.size-btn').forEach((b) => {
          b.className =
            'size-btn border-2 border-slate-200 rounded-xl py-4 text-slate-500 font-bold transition hover:bg-slate-50'
        })
        btn.className =
          'size-btn border-2 border-blue-600 bg-blue-50 text-blue-700 rounded-xl py-4 font-black transition shadow-inner'
      }

      async function confirmStorage() {
        const nome = document.getElementById('input-nome').value
        const apt = document.getElementById('input-apt').value
        showView('view-loading')
        document.getElementById('loading-text').innerText = 'Salvando e notificando...'
        try {
          const response = await fetch(`${API_URL}/api/encomendas`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nome: nome,
              apartamento: apt,
              tamanho: selectedSize,
              foto_pacote: photoBase64,
            }),
          })
          const result = await response.json()
          if (response.ok) showView('view-success')
          else {
            alert(result.error)
            showView('view-form')
          }
        } catch (err) {
          alert('Erro no Servidor.')
          showView('view-form')
        }
      }

      function resetApp() {
        document.getElementById('input-nome').value = ''
        document.getElementById('input-apt').value = ''
        selectedSize = ''
        photoBase64 = ''
        document.querySelectorAll('.size-btn').forEach((b) => {
          b.className =
            'size-btn border-2 border-slate-200 rounded-xl py-4 text-slate-500 font-bold transition hover:bg-slate-50'
        })
        document.getElementById('loading-text').innerText = 'Processando Nuvem IA...'
        showView('view-home')
      }
    </script>
  </body>
</html>
