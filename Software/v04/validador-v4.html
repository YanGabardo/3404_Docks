<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CondLog v4 - Leitor QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  </head>
  <body
    class="bg-slate-900 font-sans text-white h-screen flex flex-col items-center justify-center relative overflow-hidden"
  >
    <div
      class="absolute inset-0 opacity-10 pointer-events-none"
      style="background-image: radial-gradient(#3b82f6 1px, transparent 1px); background-size: 20px 20px"
    ></div>

    <div class="z-10 text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-500 tracking-wider">CONDLOG</h1>
      <p class="text-slate-400 mt-2 text-lg">Apresente seu QR Code para retirar sua encomenda</p>
    </div>

    <div
      class="z-10 bg-slate-800 p-2 rounded-2xl shadow-2xl border-4 border-slate-700 relative w-full max-w-lg"
    >
      <div
        id="reader"
        class="rounded-xl overflow-hidden bg-black"
        style="width: 100%; min-height: 350px"
      ></div>

      <div
        id="overlay-result"
        class="absolute inset-0 bg-slate-900 bg-opacity-95 rounded-2xl flex flex-col items-center justify-center hidden"
        style="backdrop-filter: blur(5px)"
      >
        <div id="icon-success" class="hidden text-green-500 mb-4">
          <svg class="w-24 h-24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <div id="icon-error" class="hidden text-red-500 mb-4">
          <svg class="w-24 h-24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </div>
        <h2 id="result-title" class="text-3xl font-bold mb-2">Verificando...</h2>
        <p id="result-msg" class="text-slate-300 text-lg text-center px-6">Por favor, aguarde.</p>
      </div>
    </div>

    <div class="z-10 mt-8 flex items-center gap-3">
      <span class="flex h-4 w-4 relative">
        <span
          class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"
        ></span>
        <span class="relative inline-flex rounded-full h-4 w-4 bg-blue-500"></span>
      </span>
      <span class="text-slate-300 font-medium">Câmera de Segurança Ativa e Integrada</span>
    </div>

    <script>
      const API_URL =
        window.location.hostname === '' ? 'http://127.0.0.1:5000' : `http://${window.location.hostname}:5000`
      let html5QrCode
      let isProcessing = false

      async function initScanner() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('ERRO DE SEGURANÇA: Câmera bloqueada. Abra via localhost.')
          return
        }

        html5QrCode = new Html5Qrcode('reader')
        const config = { fps: 15, qrbox: { width: 250, height: 250 } }

        try {
          await html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, onScanFailure)
        } catch (err) {
          try {
            await html5QrCode.start({ facingMode: 'user' }, config, onScanSuccess, onScanFailure)
          } catch (err2) {
            alert('Falha ao ligar a câmera.')
          }
        }
      }

      async function onScanSuccess(decodedText) {
        if (isProcessing) return
        isProcessing = true
        showOverlay(true, 'Verificando Criptografia...', '', null)

        try {
          const res = await fetch(`${API_URL}/api/validar_qr`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: decodedText }),
          })
          const data = await res.json()
          if (res.ok) {
            showOverlay(
              true,
              'ACESSO LIBERADO',
              `Prateleiras Destravadas:\n ${data.prateleiras_acionadas.join(', ')}`,
              'success',
            )
          } else {
            showOverlay(true, 'ACESSO NEGADO', data.message, 'error')
          }
        } catch (err) {
          showOverlay(true, 'ERRO DE REDE', 'Não foi possível contatar o servidor central.', 'error')
        }

        setTimeout(() => {
          showOverlay(false)
          isProcessing = false
        }, 5000)
      }

      function onScanFailure(error) {}

      function showOverlay(show, title = '', msg = '', type = null) {
        const overlay = document.getElementById('overlay-result')
        const iconSuccess = document.getElementById('icon-success')
        const iconError = document.getElementById('icon-error')

        if (show) {
          overlay.classList.remove('hidden')
          document.getElementById('result-title').innerText = title
          document.getElementById('result-msg').innerText = msg
          iconSuccess.classList.add('hidden')
          iconError.classList.add('hidden')

          if (type === 'success') {
            iconSuccess.classList.remove('hidden')
            document.getElementById('result-title').className = 'text-3xl font-bold mb-2 text-green-400'
          } else if (type === 'error') {
            iconError.classList.remove('hidden')
            document.getElementById('result-title').className = 'text-3xl font-bold mb-2 text-red-500'
          }
        } else {
          overlay.classList.add('hidden')
        }
      }

      initScanner()
    </script>
  </body>
</html>
